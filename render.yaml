services:
  - type: web
    name: neerus-inventory-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGODB_URI
        sync: false
      - key: WRITE_API_KEY
        sync: false
      - key: DATABASE_NAME
        value: neerus
      - key: COLLECTION_NAME
        value: inventory
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.example.com
